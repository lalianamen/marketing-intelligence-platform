name: scheduler

# Hourly trigger for background work (due daily syncs, retries, lease recovery).
# Vercel Hobby cron runs only once a day, so connector times chosen by users are
# honoured to within about an hour by this workflow. It calls the same protected
# endpoint as Vercel Cron. Needs the repository secret CRON_SECRET (same value as
# in Vercel); without it the job does nothing.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger background jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://marketing-intelligence-platform-phi.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set; skipping."
            exit 0
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/jobs/run")
          echo "HTTP $code"
          cat response.json; echo
          test "$code" = "200"
